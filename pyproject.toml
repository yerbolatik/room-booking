[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "room-booking"
version = "0.1.0"
description = "Room booking backend service"
requires-python = ">=3.12"
dependencies = [
    "Django==5.0.6",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "django-filter==24.2",
    "drf-spectacular==0.27.2",
    "gunicorn==22.0.0",
    "psycopg2-binary==2.9.9",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-django==4.8.0",
    "pytest-cov==5.0.0",
    "coverage==7.13.4",
    "factory-boy==3.3.0",
    "Faker==40.4.0",
    "mypy==1.10.1",
    "django-stubs==5.0.2",
    "django-stubs-ext==5.2.9",
    "djangorestframework-stubs==3.15.0",
    "types-PyYAML==6.0.12.20250915",
    "types-requests==2.32.4.20260107",
    "ruff==0.4.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "config*"]

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --tb=short -v --cov=apps --cov-report=term-missing --cov-report=html:htmlcov"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
ignore_missing_imports = true
warn_unused_ignores = false

[tool.django-stubs]
django_settings_module = "config.settings.development"

[[tool.mypy.overrides]]
module = [
    "apps.*.tests.*",
    "apps.*.migrations.*",
    "apps.*.admin",
    "apps.core.management.*",
]
ignore_errors = true

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]
